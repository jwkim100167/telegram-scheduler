[project]
name = "burn-collector"
version = "0.1.0"
description = "불타기 투자 대시보드 - 종목 언급 수집기"
requires-python = ">=3.11"
dependencies = [
  "feedparser>=6.0",
  "requests>=2.31",
  "supabase>=2.3",
  "python-dotenv>=1.0",
  "pdfplumber>=0.11",   # MVP 이후 PDF 수집용
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
